version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      patch-minor:
        patterns:
          - '*'
        update-types:
          - patch
          - minor
    ignore:
      - dependency-name: next
        versions:
          - '>=16'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
